# SongForge production host. This file assumes the app and volume already exist.
# Infrastructure creation is intentionally outside deployment so existing durable
# state is never replaced implicitly.

app = "songforge-web"
primary_region = "bos"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  NEXT_TELEMETRY_DISABLED = "1"
  ROUTENOTE_STATE_ROOT = "/data/.songforge/routenote"
  ROUTENOTE_PROFILE_DIR = "/data/.songforge/routenote/browser-profile"
  ROUTENOTE_MEDIA_ROOT = "/data/media"
  ROUTENOTE_BROWSER_EXECUTABLE_PATH = "/usr/bin/chromium"
  ROUTENOTE_HEADLESS = "1"
  ROUTENOTE_CLOSE_BROWSER = "1"
  ROUTENOTE_SELECTOR_CONTRACT_VERSION = "UNVERIFIED"

[[mounts]]
  source = "songforge_data"
  destination = "/data"

[deploy]
  release_command = "/app/apps/web/docker/migrate.sh"
  strategy = "immediate"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "8s"
    grace_period = "45s"
    method = "GET"
    path = "/api/health/readiness"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2048mb"
  cpus = 2
