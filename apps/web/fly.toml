# Songforge web — Fly.io
#
# First time:
#   fly launch --config apps/web/fly.toml --no-deploy
#   fly secrets set OPENAI_API_KEY=...   # optional, for remote forge
# Deploy:
#   fly deploy --config apps/web/fly.toml --dockerfile apps/web/Dockerfile
#
# App name is a placeholder — change before first launch.

app = "songforge-web"
primary_region = "bos"

[build]
  dockerfile = "Dockerfile"
  # Build context is monorepo root when you pass --dockerfile from root,
  # or set:
  #   fly deploy -c apps/web/fly.toml --dockerfile apps/web/Dockerfile

[env]
  PORT = "3000"
  NODE_ENV = "production"
  NEXT_TELEMETRY_DISABLED = "1"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
