worker_processes 1;
pid /tmp/songforge-nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
  }

  upstream songforge_app {
    server 127.0.0.1:3001;
    keepalive 16;
  }

  upstream routenote_desktop_interactive {
    server 127.0.0.1:6080;
  }

  upstream routenote_desktop_view {
    server 127.0.0.1:6081;
  }

  server {
    listen 3000;
    server_name _;
    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /_routenote_desktop_interactive_authority {
      internal;
      proxy_pass http://songforge_app/api/distribution/routenote/desktop-authority?mode=INTERACTIVE;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Cookie $http_cookie;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location = /_routenote_desktop_view_authority {
      internal;
      proxy_pass http://songforge_app/api/distribution/routenote/desktop-authority?mode=VIEW_ONLY;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Cookie $http_cookie;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location ^~ /routenote-desktop/ {
      auth_request /_routenote_desktop_interactive_authority;
      proxy_pass http://routenote_desktop_interactive/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host 127.0.0.1;
      proxy_read_timeout 20m;
      proxy_send_timeout 20m;
      add_header Cache-Control "no-store" always;
      add_header X-Frame-Options SAMEORIGIN always;
    }

    location ^~ /routenote-draft-view/ {
      auth_request /_routenote_desktop_view_authority;
      proxy_pass http://routenote_desktop_view/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host 127.0.0.1;
      proxy_read_timeout 20m;
      proxy_send_timeout 20m;
      add_header Cache-Control "no-store" always;
      add_header X-Frame-Options SAMEORIGIN always;
    }

    location / {
      proxy_pass http://songforge_app;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 20m;
      proxy_send_timeout 20m;
    }
  }
}
