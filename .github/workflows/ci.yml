name: CI

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci.yml"
  push:
    branches: [main, songforge-lab]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://songforge:songforge@localhost:5432/songforge?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Git whitespace check
        run: git diff --check

      - name: Prisma validate
        run: pnpm db:validate

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Verify single Next config
        run: |
          count=$(find apps/web -maxdepth 1 -type f -name 'next.config.*' | wc -l | tr -d ' ')
          echo "Next config count: $count"
          test "$count" -eq 1

      - name: Build web
        run: pnpm --filter @songforge/web build

      - name: Verify standalone server layout
        run: test -f apps/web/.next/standalone/apps/web/server.js

      - name: Build production container
        run: docker build -f apps/web/Dockerfile -t songforge-web-ci .

      - name: Verify production container runtime
        run: |
          docker run --rm --entrypoint sh songforge-web-ci -c \
            'test -f /app/apps/web/server.js && command -v ffprobe && command -v whisper-cli && test -s /models/ggml-base.en.bin'

      - name: Smoke production container
        run: |
          cid=$(docker run -d --rm \
            -e DATABASE_URL=postgresql://songforge:songforge@127.0.0.1:5432/songforge?schema=public \
            -p 3000:3000 songforge-web-ci)
          trap 'docker stop "$cid" >/dev/null 2>&1 || true' EXIT
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/video-lab >/dev/null; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            docker logs "$cid"
            exit 1
          fi

  persist:
    name: Postgres persist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: songforge
          POSTGRES_PASSWORD: songforge
          POSTGRES_DB: songforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U songforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://songforge:songforge@localhost:5432/songforge?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm --filter @songforge/agents test
