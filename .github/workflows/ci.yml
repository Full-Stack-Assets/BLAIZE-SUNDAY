name: CI

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".dockerignore"
      - ".env.example"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy.yml"
  push:
    branches: [main, songforge-lab]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".dockerignore"
      - ".env.example"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck · Test · Build · Runtime
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: postgresql://songforge:songforge@localhost:5432/songforge?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Git whitespace check
        run: git diff --check

      - name: Prisma validate
        run: pnpm db:validate

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Verify single Next config
        run: |
          count=$(find apps/web -maxdepth 1 -type f -name 'next.config.*' | wc -l | tr -d ' ')
          echo "Next config count: $count"
          test "$count" -eq 1

      - name: Build web
        run: pnpm --filter @songforge/web build

      - name: Verify standalone server layout
        run: test -f apps/web/.next/standalone/apps/web/server.js

      - name: Build exact-revision production container
        run: |
          docker build \
            --build-arg SONGFORGE_BUILD_SHA="$GITHUB_SHA" \
            -f apps/web/Dockerfile \
            -t songforge-web-ci .

      - name: Verify production runtime inventory
        run: |
          docker run --rm --entrypoint sh songforge-web-ci -ec '
            test -f /app/apps/web/server.js
            test -f /app/packages/database/prisma/schema.prisma
            test -f /usr/share/novnc/vnc.html
            command -v ffprobe
            command -v whisper-cli
            command -v chromium
            command -v Xvfb
            command -v x11vnc
            command -v websockify
            command -v nginx
            command -v tini
            command -v su-exec
            command -v prisma
            test -s /models/ggml-base.en.bin
            chromium --version
            nginx -t -c /app/apps/web/docker/nginx.conf
          '

      - name: Prove Chromium launches without disabling its sandbox
        run: |
          docker run --rm --entrypoint sh songforge-web-ci -ec '
            timeout 30 su-exec nextjs:nodejs chromium \
              --headless=new \
              --disable-gpu \
              --disable-dev-shm-usage \
              --dump-dom about:blank >/tmp/chromium-smoke.html
            grep -qi "html" /tmp/chromium-smoke.html
          '

      - name: Smoke production container and owner-gated desktop
        run: |
          cid=$(docker run -d --rm \
            -e ROUTENOTE_CONTROL_PASSPHRASE=ci-owner-passphrase \
            -p 3000:3000 songforge-web-ci)
          trap 'docker stop "$cid" >/dev/null 2>&1 || true' EXIT
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health/live >/tmp/live.json; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            docker logs "$cid"
            exit 1
          fi
          jq -e --arg sha "$GITHUB_SHA" '.ok == true and .deploymentSha == $sha' /tmp/live.json
          code=$(curl -sS -o /tmp/desktop-denied -w '%{http_code}' \
            http://127.0.0.1:3000/routenote-desktop/vnc.html)
          test "$code" = "401"
          curl -sS http://127.0.0.1:3000/api/health/readiness >/tmp/readiness.json
          jq -e '.routenote.browser.available == true' /tmp/readiness.json

  persist:
    name: Postgres migrations · persistence tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: songforge
          POSTGRES_PASSWORD: songforge
          POSTGRES_DB: songforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U songforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://songforge:songforge@localhost:5432/songforge?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Apply deterministic migrations
        run: pnpm db:migrate
      - name: Seed test database only
        run: pnpm db:seed
      - run: pnpm --filter @songforge/agents test
