name: CI

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci.yml"
  push:
    branches: [main, songforge-lab]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/songforge?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          # No cache: pnpm until pnpm-lock.yaml is committed

      - name: Install
        run: pnpm install --no-frozen-lockfile

      # A repository-wide Prettier probe currently reports 90 files across
      # existing Songforge code/docs and this feature. PR #7 records that debt;
      # this workflow keeps functional gates strict without unrelated mass formatting.
      - name: Git whitespace check
        run: git diff --check

      - name: Prisma validate
        run: pnpm db:validate

      - name: Prisma generate
        run: pnpm db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Verify single Next config
        run: |
          count=$(find apps/web -maxdepth 1 -type f -name 'next.config.*' | wc -l | tr -d ' ')
          echo "Next config count: $count"
          test "$count" -eq 1

      - name: Build web
        run: pnpm --filter @songforge/web build

      - name: Verify standalone server layout
        run: test -f apps/web/.next/standalone/apps/web/server.js
