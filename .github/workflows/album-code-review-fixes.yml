name: Album code-review hardening

on:
  push:
    branches:
      - album/archive-remaster-derived-edition
    paths:
      - ".github/workflows/album-code-review-fixes.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Apply independently red-green verified review patch
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | gunzip > /tmp/album-review-fixes.patch
          git apply --check /tmp/album-review-fixes.patch
          git apply /tmp/album-review-fixes.patch
      - run: pnpm install --frozen-lockfile
      - name: Verify album hardening
        run: |
          pnpm --filter @songforge/album test
          pnpm --filter @songforge/album typecheck
          pnpm exec prettier --check packages/album/src/cli.ts packages/album/src/cli.test.ts packages/album/src/mastering.ts packages/album/src/mastering.test.ts packages/album/src/validator.ts packages/album/src/validator.test.ts
      - name: Commit verified repair and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/album-code-review-fixes.yml
          git add packages/album/src/cli.ts packages/album/src/cli.test.ts packages/album/src/mastering.ts packages/album/src/mastering.test.ts packages/album/src/validator.ts packages/album/src/validator.test.ts
          git commit -m "fix(album): harden provenance and mastering validation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
