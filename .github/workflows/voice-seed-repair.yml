name: Repair D1 seed integration

on:
  push:
    branches:
      - album/final-approval-packets
    paths:
      - ".github/workflows/voice-seed-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: songforge
          POSTGRES_PASSWORD: songforge
          POSTGRES_DB: songforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U songforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://songforge:songforge@localhost:5432/songforge?schema=public
      NODE_OPTIONS: --experimental-strip-types --no-warnings=ExperimentalWarning
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply tested D1 seed repair
        run: |
          cat > packages/database/src/voice-seed.ts <<'EOF'
          export const SUNDAY_AFTER_MIDNIGHT_D1 = {
            voiceIdentityId: "blaize-sunday/sunday-after-midnight",
            internalCandidate: "D1",
            provider: "elevenlabs",
            providerVoiceId: "j9nOYxfwt3sxAi32BnNI",
            providerAssetClass: "generated_persisted",
            status: "D1_PERSISTED_G2_PENDING",
            sourceDesignRunId: "32251130820",
            persistenceRunId: "32251778352",
            persistenceArtifactId: "9364690010",
            approvalId: "BLAIZE-G2-D1-SELECTION-2026-08-19",
            g2Locked: false,
            singingValidated: false,
            productionScalingAuthorized: false,
            referenceAudioUsed: false,
            rights: {
              ownership: "PROVIDER_PERSISTED_USER_ASSET",
              commercialContinuity: "UNVERIFIED"
            },
            timbre: {
              register: "warm masculine low-mid",
              micPerspective: "intimate close-mic",
              cadence: "relaxed, slightly behind the beat",
              sibilants: "clean",
              breath: "controlled",
              emotionalBaseline: "guarded",
              accent: "contemporary American, not strongly regional"
            },
            antiTargets: [
              "announcer or radio-DJ projection",
              "exaggerated bass or rasp",
              "cartoon swagger",
              "glossy generic pop tenor",
              "theatrical diction",
              "smeared consonants or lispy sibilants",
              "imitation of a known living performer"
            ],
            modes: {
              sundayTalk: { speed: 0.92, stability: 0.58, similarityBoost: 0.82, style: 0.1 },
              blaizeMode: { speed: 1.08, stability: 0.42, similarityBoost: 0.84, style: 0.28 },
              velvet: { speed: 0.86, stability: 0.5, similarityBoost: 0.86, style: 0.22 },
              zeroStatic: { speed: 0.78, stability: 0.68, similarityBoost: 0.88, style: 0.04 }
            },
            g2Thresholds: {
              aggregateSamePerformerRecognition: 0.7,
              minimumModePairRecognition: 0.6,
              minimumValidIndependentRaters: 12
            }
          };

          export const D1_REFERENCE_ASSET = {
            candidate: "D1",
            provider: "elevenlabs",
            providerVoiceId: SUNDAY_AFTER_MIDNIGHT_D1.providerVoiceId,
            sourceDesignRunId: SUNDAY_AFTER_MIDNIGHT_D1.sourceDesignRunId,
            persistenceRunId: SUNDAY_AFTER_MIDNIGHT_D1.persistenceRunId,
            persistenceArtifactId: SUNDAY_AFTER_MIDNIGHT_D1.persistenceArtifactId,
            approvalId: SUNDAY_AFTER_MIDNIGHT_D1.approvalId,
            referenceAudioUsed: false,
            status: SUNDAY_AFTER_MIDNIGHT_D1.status
          };

          function isD1Reference(value: unknown): boolean {
            if (!value || typeof value !== "object" || Array.isArray(value)) return false;
            const record = value as Record<string, unknown>;
            return (
              record.candidate === "D1" ||
              record.providerVoiceId === SUNDAY_AFTER_MIDNIGHT_D1.providerVoiceId ||
              (record.provider === "elevenlabs" && record.approvalId === SUNDAY_AFTER_MIDNIGHT_D1.approvalId)
            );
          }

          export function mergeApprovedReferenceAssets(existing: unknown): unknown[] {
            const assets = Array.isArray(existing) ? existing : [];
            return [...assets.filter((asset) => !isD1Reference(asset)), D1_REFERENCE_ASSET];
          }

          export function buildD1VoiceProfileSeed(existingReferenceAssets: unknown) {
            return {
              // The current status route consumes canonicalVoiceId as the provider voice ID.
              canonicalVoiceId: SUNDAY_AFTER_MIDNIGHT_D1.providerVoiceId,
              provider: SUNDAY_AFTER_MIDNIGHT_D1.provider,
              verificationStatus: SUNDAY_AFTER_MIDNIGHT_D1.status,
              vocalSettings: SUNDAY_AFTER_MIDNIGHT_D1,
              approvedReferenceAssets: mergeApprovedReferenceAssets(existingReferenceAssets)
            };
          }
          EOF

          cat > packages/database/src/voice-seed.test.ts <<'EOF'
          import assert from "node:assert/strict";
          import test from "node:test";

          import {
            D1_REFERENCE_ASSET,
            SUNDAY_AFTER_MIDNIGHT_D1,
            buildD1VoiceProfileSeed,
            mergeApprovedReferenceAssets
          } from "./voice-seed.ts";

          test("D1 seed uses the persisted ElevenLabs provider voice id without claiming G2 lock", () => {
            assert.equal(SUNDAY_AFTER_MIDNIGHT_D1.providerVoiceId, "j9nOYxfwt3sxAi32BnNI");
            assert.equal(SUNDAY_AFTER_MIDNIGHT_D1.status, "D1_PERSISTED_G2_PENDING");
            assert.equal(SUNDAY_AFTER_MIDNIGHT_D1.g2Locked, false);
            const profile = buildD1VoiceProfileSeed([]);
            assert.equal(profile.canonicalVoiceId, "j9nOYxfwt3sxAi32BnNI");
            assert.equal(profile.provider, "elevenlabs");
          });

          test("reference merge preserves historical B3 evidence and de-duplicates D1", () => {
            const existing = [
              { candidate: "B3", providerVoiceId: "10863794b2454eaa8781f377939d6f14", historical: true },
              { candidate: "D1", providerVoiceId: "old-d1", stale: true }
            ];
            const merged = mergeApprovedReferenceAssets(existing);
            assert.equal(merged.length, 2);
            assert.equal((merged[0] as Record<string, unknown>).candidate, "B3");
            assert.deepEqual(merged[1], D1_REFERENCE_ASSET);
          });
          EOF

          python3 - <<'PY'
          import json
          from pathlib import Path
          package = Path('packages/database/package.json')
          data = json.loads(package.read_text())
          data['scripts']['test'] = 'node --test src/*.test.ts'
          package.write_text(json.dumps(data, indent=2) + '\n')

          seed = Path('packages/database/src/seed.ts')
          text = seed.read_text()
          if 'from "./voice-seed.ts"' not in text:
              text = text.replace('import { prisma } from "./client.ts";\n', 'import { prisma } from "./client.ts";\nimport { buildD1VoiceProfileSeed } from "./voice-seed.ts";\n')
          start = text.index('  await prisma.voiceProfile.upsert({')
          end = text.index('\n\n  for (const [id, name, category, implementationStatus] of ROLES)', start)
          replacement = '''  const existingVoiceProfile = await prisma.voiceProfile.findUnique({\n    where: { artistId: artist.id }\n  });\n  const d1VoiceProfile = buildD1VoiceProfileSeed(existingVoiceProfile?.approvedReferenceAssets);\n\n  await prisma.voiceProfile.upsert({\n    where: { artistId: artist.id },\n    update: d1VoiceProfile,\n    create: {\n      artistId: artist.id,\n      ...d1VoiceProfile\n    }\n  });'''
          seed.write_text(text[:start] + replacement + text[end:])
          PY

          pnpm exec prettier --write packages/database/src/voice-seed.ts packages/database/src/voice-seed.test.ts packages/database/src/seed.ts packages/database/package.json
      - name: Verify focused seed contract
        run: |
          pnpm db:generate
          pnpm --filter @songforge/database typecheck
          pnpm --filter @songforge/database test
      - name: Verify ephemeral Postgres seed
        run: |
          pnpm db:migrate
          pnpm db:seed
          pnpm db:seed
      - name: Commit repair and remove temporary workflow
        run: |
          rm .github/workflows/voice-seed-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(voice): repair D1 seed integration and preserve history"
          git push origin "HEAD:${GITHUB_REF_NAME}"
