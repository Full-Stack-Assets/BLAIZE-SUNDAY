name: Album lockfile reconcile

on:
  push:
    branches:
      - album/archive-remaster-derived-edition
    paths:
      - ".github/workflows/album-lockfile-reconcile.yml"
      - "packages/album/package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: write

concurrency:
  group: album-lockfile-reconcile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Regenerate workspace lockfile
        run: pnpm install --lockfile-only
      - name: Commit lockfile only when changed
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already reconciled"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(album): reconcile pnpm lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
