name: One-shot Video Factory lockfile repair

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/refresh-video-lockfile-pr.yml"

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.ref == 'agent/video-factory-wisebase-v0.2a'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/video-factory-wisebase-v0.2a
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Regenerate workspace lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit deterministic lockfile and remove one-shot helpers
        shell: bash
        run: |
          rm -f \
            .github/workflows/refresh-video-lockfile-pr.yml \
            .github/workflows/refresh-video-lockfile.yml \
            .github/lockfile-refresh-trigger \
            .github/merge-resolution-notes.tmp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml .github/workflows/refresh-video-lockfile-pr.yml .github/workflows/refresh-video-lockfile.yml .github/lockfile-refresh-trigger .github/merge-resolution-notes.tmp
          git commit -m "chore: refresh lockfile after main reconciliation"
          git push origin HEAD:agent/video-factory-wisebase-v0.2a
