name: Preview

# Superseded by deploy.yml for real deploys.
# Kept as a manual Docker build check (no Vercel).

on:
  workflow_dispatch:

jobs:
  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: false
          tags: songforge-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
