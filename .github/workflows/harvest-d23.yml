name: Harvest D2 D3 Comparator Run
on:
  push:
    branches: [voice/elevenlabs-design-adapter]
    paths: ['.github/d23-harvest-trigger']
permissions:
  actions: read
  contents: write
jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: voice/elevenlabs-design-adapter
      - name: Locate comparator run and artifact
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 6d0bafb3832e279c1b1edb314449f8c7f48bdb6e
        shell: bash
        run: |
          mkdir -p .github/receipts
          for i in $(seq 1 40); do
            DATA=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/elevenlabs-d23-comparators.yml/runs?head_sha=${TARGET_SHA}&per_page=10")
            RUN_ID=$(printf '%s' "$DATA" | jq -r '.workflow_runs[0].id // empty')
            STATUS=$(printf '%s' "$DATA" | jq -r '.workflow_runs[0].status // empty')
            CONCLUSION=$(printf '%s' "$DATA" | jq -r '.workflow_runs[0].conclusion // empty')
            if [ -n "$RUN_ID" ] && [ "$STATUS" = "completed" ]; then break; fi
            sleep 10
          done
          test -n "$RUN_ID"
          ARTS=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts")
          ART_ID=$(printf '%s' "$ARTS" | jq -r '.artifacts[] | select(.name=="sunday-after-midnight-d2-d3-comparators") | .id' | head -1)
          jq -n --argjson run_id "$RUN_ID" --arg head_sha "$TARGET_SHA" --arg status "$STATUS" --arg conclusion "$CONCLUSION" --argjson artifact_id "${ART_ID:-0}" '{run_id:$run_id,head_sha:$head_sha,status:$status,conclusion:$conclusion,artifact_id:$artifact_id}' > .github/receipts/elevenlabs-d23-last-run.json
      - name: Commit receipt
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/receipts/elevenlabs-d23-last-run.json
          git commit -m 'evidence: record D2 D3 comparator run' || exit 0
          git push origin HEAD:voice/elevenlabs-design-adapter
