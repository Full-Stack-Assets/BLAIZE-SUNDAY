name: Album format reconcile

on:
  push:
    branches:
      - album/archive-remaster-derived-edition
    paths:
      - ".github/workflows/album-format-reconcile.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format album-scoped changed files
        run: |
          pnpm exec prettier --write packages/album album/edition docs/superpowers/specs/2026-08-20-blaize-album-curation-derived-production-edition-design.md docs/superpowers/plans/2026-08-20-album-foundation-tracks-01-03.md package.json pnpm-lock.yaml
      - name: Commit formatting when needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/album album/edition docs/superpowers/specs/2026-08-20-blaize-album-curation-derived-production-edition-design.md docs/superpowers/plans/2026-08-20-album-foundation-tracks-01-03.md package.json pnpm-lock.yaml
          git commit -m "style(album): format album implementation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
