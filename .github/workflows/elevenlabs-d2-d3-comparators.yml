name: Persist D2 D3 G2 Comparators

on:
  push:
    branches:
      - voice/elevenlabs-design-adapter
    paths:
      - ".github/workflows/elevenlabs-d2-d3-comparators.yml"

permissions:
  contents: read

jobs:
  persist:
    runs-on: ubuntu-latest
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Persist comparator voices and render four modes each
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ELEVENLABS_API_KEY"
          mkdir -p artifacts/d2-d3
          node <<'NODE'
          const fs=require('fs'); const key=process.env.ELEVENLABS_API_KEY;
          const candidates=[{candidate:'D2',generated:'3tirLXWADaTCQY1YVY2Q'},{candidate:'D3',generated:'2LfZz8mEirOEjSjAmv0D'}];
          const modes={SUNDAY_TALK:{text:'I bought the jacket because it looked responsible. That was the first mistake. The second was assuming anybody in the room knew what they were doing.',settings:{stability:0.58,similarity_boost:0.82,style:0.18,use_speaker_boost:true}},BLAIZE_MODE:{text:'Card declined. Camera flashed. I smiled anyway. Bad timing looks expensive when the outfit is right, so keep the receipt and act surprised.',settings:{stability:0.42,similarity_boost:0.84,style:0.42,use_speaker_boost:true}},VELVET:{text:'Stay a little longer. The room is almost beautiful when nobody says what they mean. I can make the silence look good if you can leave it alone.',settings:{stability:0.48,similarity_boost:0.86,style:0.34,use_speaker_boost:true}},ZERO_STATIC:{text:'I keep making jokes because the truth arrives too early. Some nights I can hear the room go quiet before I even say it. I wish that bothered me less.',settings:{stability:0.68,similarity_boost:0.88,style:0.08,use_speaker_boost:true}}};
          async function jf(url,opts){const r=await fetch(url,opts);if(!r.ok)throw new Error(`${r.status}:${await r.text()}`);return r}
          (async()=>{const receipt={approvedBy:'Human Authority',approvalId:'CHAT-2026-08-19-D2-D3-KEEP',purpose:'G2_COMPARATOR_RETAINED_NOT_PRODUCTION',voices:[]};for(const c of candidates){const body={voice_name:`SUNDAY AFTER MIDNIGHT ${c.candidate} COMPARATOR`,voice_description:'Retained original Voice Design candidate used only as a blinded G2 comparator for BLAIZE SUNDAY. Not authorized as production identity.',generated_voice_id:c.generated,labels:{artist:'BLAIZE SUNDAY',role:'G2_COMPARATOR',production:'false',retain:'true'}};const cr=await jf('https://api.elevenlabs.io/v1/text-to-voice',{method:'POST',headers:{'xi-api-key':key,'content-type':'application/json'},body:JSON.stringify(body)});const created=await cr.json();const voiceId=created.voice_id;if(!voiceId)throw new Error('missing voice_id');const item={candidate:c.candidate,generatedVoiceId:c.generated,voiceId,productionAuthorized:false,retain:true,renders:{}};for(const [mode,spec] of Object.entries(modes)){const rr=await jf(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}?output_format=mp3_44100_128`,{method:'POST',headers:{'xi-api-key':key,'content-type':'application/json'},body:JSON.stringify({text:spec.text,model_id:'eleven_multilingual_v2',voice_settings:spec.settings})});const b=Buffer.from(await rr.arrayBuffer());const fn=`artifacts/d2-d3/${c.candidate}_${mode}.mp3`;fs.writeFileSync(fn,b);item.renders[mode]=fn}receipt.voices.push(item)}fs.writeFileSync('artifacts/d2-d3/receipt.json',JSON.stringify(receipt,null,2))})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: sunday-after-midnight-d2-d3-comparators
          path: artifacts/d2-d3
          retention-days: 30
