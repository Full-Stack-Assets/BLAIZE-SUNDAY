name: Harvest D1 persistence run

on:
  push:
    branches:
      - voice/elevenlabs-design-adapter
    paths:
      - ".github/workflows/harvest-d1-persist-run.yml"

permissions:
  actions: read
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: voice/elevenlabs-design-adapter
          fetch-depth: 0

      - name: Find exact persistence run and wait for completion
        id: find
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: bf969b4c7a4603b95c1f3b83d0a8080ddc5d752e
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&event=push&per_page=100"
          run_id=""
          conclusion=""
          status=""
          for i in $(seq 1 60); do
            payload=$(curl -fsS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api")
            run_id=$(printf '%s' "$payload" | jq -r '.workflow_runs[] | select(.name == "Persist D1 and render G2 proxies") | .id' | head -n 1)
            if [ -n "$run_id" ] && [ "$run_id" != "null" ]; then
              status=$(printf '%s' "$payload" | jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .status')
              conclusion=$(printf '%s' "$payload" | jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .conclusion')
              if [ "$status" = "completed" ]; then break; fi
            fi
            sleep 5
          done
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "target run not found" >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"

      - name: Record artifact receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.find.outputs.run_id }}
          RUN_STATUS: ${{ steps.find.outputs.status }}
          RUN_CONCLUSION: ${{ steps.find.outputs.conclusion }}
        run: |
          set -euo pipefail
          artifacts=$(curl -fsS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts")
          artifact_id=$(printf '%s' "$artifacts" | jq -r '.artifacts[] | select(.name == "sunday-after-midnight-d1-g2-proxies") | .id' | head -n 1)
          mkdir -p .github/receipts
          jq -n \
            --argjson run_id "$RUN_ID" \
            --arg head_sha "bf969b4c7a4603b95c1f3b83d0a8080ddc5d752e" \
            --arg status "$RUN_STATUS" \
            --arg conclusion "$RUN_CONCLUSION" \
            --arg artifact_id "$artifact_id" \
            '{run_id:$run_id,head_sha:$head_sha,status:$status,conclusion:$conclusion,artifact_id:($artifact_id|tonumber?)}' \
            > .github/receipts/elevenlabs-d1-persist-last-run.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/receipts/elevenlabs-d1-persist-last-run.json
          git commit -m "chore: record D1 persistence run receipt"
          git push origin HEAD:voice/elevenlabs-design-adapter
          if [ "$RUN_CONCLUSION" != "success" ]; then
            exit 1
          fi
