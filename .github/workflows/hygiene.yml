name: Hygiene

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  hygiene:
    name: Format · Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
        continue-on-error: true
      - run: pnpm audit --prod
        continue-on-error: true
