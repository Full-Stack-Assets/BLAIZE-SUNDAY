name: ElevenLabs D2 D3 Comparator Persistence

on:
  push:
    branches:
      - voice/elevenlabs-design-adapter
    paths:
      - ".github/d23-persist-trigger"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  persist-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify secret
        run: test -n "$ELEVENLABS_API_KEY"
      - name: Persist retained comparators and render four modes
        shell: bash
        run: |
          mkdir -p artifacts/d23
          node <<'NODE'
          const fs = require('node:fs');
          const base = 'https://api.elevenlabs.io';
          const key = process.env.ELEVENLABS_API_KEY;
          const candidates = [
            { candidate: 'D2', generatedVoiceId: '3tirLXWADaTCQY1YVY2Q' },
            { candidate: 'D3', generatedVoiceId: '2LfZz8mEirOEjSjAmv0D' },
          ];
          const description = 'Original contemporary American masculine artist voice in a warm low-mid register. Intimate close-mic presence, relaxed slightly behind-the-beat phrasing, dry self-aware confidence, clean sibilants and crisp consonants, controlled breath texture, and an emotionally guarded baseline that can reveal precise vulnerability without melodrama. Modern, region-neutral, lightly textured, smooth rather than booming, capable of rhythm-forward melodic-rap delivery and soft R&B extension.';
          const modes = [
            ['SUNDAY_TALK','I bought the jacket because it looked responsible. That was the first mistake. The second was assuming anybody in the room knew what they were doing.',{stability:0.58,similarity_boost:0.82,style:0.10,use_speaker_boost:true,speed:0.92}],
            ['BLAIZE_MODE','Card declined. Camera flashed. I smiled anyway. Bad timing looks expensive when the outfit is right, so keep the receipt and act surprised.',{stability:0.42,similarity_boost:0.84,style:0.28,use_speaker_boost:true,speed:1.08}],
            ['VELVET','Stay a little longer. The room is almost beautiful when nobody says what they mean. I can make the silence look good if you can leave it alone.',{stability:0.50,similarity_boost:0.86,style:0.22,use_speaker_boost:true,speed:0.86}],
            ['ZERO_STATIC','I keep making jokes because the truth arrives too early. Some nights I can hear the room go quiet before I even say it. I wish that bothered me less.',{stability:0.68,similarity_boost:0.88,style:0.04,use_speaker_boost:true,speed:0.78}],
          ];
          const headers = {'xi-api-key':key,'content-type':'application/json'};
          async function ensureVoice(c) {
            const existing = await fetch(`${base}/v1/voices/${c.generatedVoiceId}`, {headers:{'xi-api-key':key}});
            if (existing.ok) return {voiceId:c.generatedVoiceId, created:false, metadata:await existing.json()};
            const r = await fetch(`${base}/v1/text-to-voice`, {method:'POST',headers,body:JSON.stringify({
              voice_name:`SUNDAY AFTER MIDNIGHT ${c.candidate} COMPARATOR`,
              voice_description:description,
              generated_voice_id:c.generatedVoiceId,
              labels:{artist:'BLAIZE SUNDAY',canon:'SUNDAY AFTER MIDNIGHT',role:'G2_COMPARATOR',production:'false',retain:'true'}
            })});
            if (!r.ok) throw new Error(`${c.candidate} persistence failed ${r.status}: ${await r.text()}`);
            const j = await r.json();
            return {voiceId:j.voice_id || c.generatedVoiceId, created:true, metadata:j};
          }
          async function render(candidate, voiceId, mode, text, settings) {
            const r = await fetch(`${base}/v1/text-to-speech/${voiceId}?output_format=mp3_44100_128`, {method:'POST',headers,body:JSON.stringify({text,model_id:'eleven_multilingual_v2',voice_settings:settings})});
            if (!r.ok) throw new Error(`${candidate} ${mode} render failed ${r.status}: ${await r.text()}`);
            const buf = Buffer.from(await r.arrayBuffer());
            const filename = `SUNDAY_AFTER_MIDNIGHT_${candidate}_${mode}.mp3`;
            fs.writeFileSync(`artifacts/d23/${filename}`, buf);
            return {mode,filename,sizeBytes:buf.length,text,settings,modelId:'eleven_multilingual_v2',outputFormat:'mp3_44100_128'};
          }
          (async()=>{
            const receipt={identityId:'blaize-sunday/sunday-after-midnight',state:'D2_D3_PERSISTED_G2_COMPARATORS',approval:{approved:true,approvedBy:'Nic Albertson / Human Authority',approvalId:'BLAIZE-G2-D23-RETAIN-2026-08-19'},productionAuthorized:false,retain:true,candidates:[]};
            for (const c of candidates) {
              const persisted=await ensureVoice(c);
              const renders=[];
              for (const [mode,text,settings] of modes) renders.push(await render(c.candidate,persisted.voiceId,mode,text,settings));
              receipt.candidates.push({candidate:c.candidate,generatedVoiceId:c.generatedVoiceId,persistedVoiceId:persisted.voiceId,createdThisRun:persisted.created,role:'G2_COMPARATOR',production:false,retain:true,renders});
            }
            fs.writeFileSync('artifacts/d23/receipt.json',JSON.stringify(receipt,null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload retained comparator evidence
        uses: actions/upload-artifact@v4
        with:
          name: sunday-after-midnight-d2-d3-comparators
          path: artifacts/d23
          if-no-files-found: error
          retention-days: 30
