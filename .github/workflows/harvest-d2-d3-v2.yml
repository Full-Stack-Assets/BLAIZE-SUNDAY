name: Harvest D2 D3 V2
on:
  push:
    branches: [voice/elevenlabs-design-adapter]
    paths: [.github/workflows/harvest-d2-d3-v2.yml]
permissions: {actions: read, contents: write}
jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          target=1c4b2673de6faa39d88ae9378a8cbeb1c0f20686
          for i in $(seq 1 30); do
            row=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=$target&event=push&per_page=20" | jq -c '.workflow_runs[]|select(.name=="Persist D2 D3 G2 Comparators")'|head -1)
            if [ -n "$row" ] && [ "$(echo "$row"|jq -r .status)" = completed ]; then
              id=$(echo "$row"|jq -r .id); con=$(echo "$row"|jq -r .conclusion); arts=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$id/artifacts"); aid=$(echo "$arts"|jq -r '.artifacts[0].id // empty'); mkdir -p .github/receipts; jq -n --argjson run_id "$id" --arg head_sha "$target" --arg conclusion "$con" --arg artifact_id "$aid" '{run_id:$run_id,head_sha:$head_sha,status:"completed",conclusion:$con,artifact_id:$artifact_id}' > .github/receipts/elevenlabs-d2-d3-v2.json; git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com;git add .github/receipts/elevenlabs-d2-d3-v2.json;git commit -m 'receipt: corrected D2 D3 comparator run';git push;exit 0
            fi
            sleep 10
          done
          exit 1
