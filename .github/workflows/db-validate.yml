name: Database validate

on:
  pull_request:
    paths:
      - "packages/database/**"
      - ".github/workflows/db-validate.yml"
  push:
    branches: [main]
    paths:
      - "packages/database/**"

jobs:
  validate:
    name: Prisma validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate client
        run: pnpm db:generate

      - name: Validate schema
        run: pnpm db:validate
