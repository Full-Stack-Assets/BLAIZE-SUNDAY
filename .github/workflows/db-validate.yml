name: Database validate

on:
  pull_request:
    paths:
      - "packages/database/**"
      - ".github/workflows/db-validate.yml"
  push:
    branches: [main]
    paths:
      - "packages/database/**"

jobs:
  validate:
    name: Prisma validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/songforge?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:validate
