services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: songforge
      POSTGRES_PASSWORD: songforge
      POSTGRES_DB: songforge
    ports:
      - "5432:5432"
    volumes:
      - songforge_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U songforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: songforge
      MINIO_ROOT_PASSWORD: songforge-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - songforge_minio:/data

volumes:
  songforge_pg:
  songforge_minio:
